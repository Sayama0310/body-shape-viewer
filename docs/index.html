<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Body Shape Viewer</title>
  <meta name="theme-color" content="#f2f2f5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="体形ビューア">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="update-banner" class="update-banner" role="status" hidden>
    <span>新しいバージョンがあります</span>
    <button type="button" id="update-button">更新</button>
  </div>
  <main class="app">
    <div id="viewer" class="viewer">
      <p id="viewer-status" class="viewer-status" role="status" hidden></p>
    </div>
    <form class="controls" id="controls" onsubmit="return false">
      <div class="row">
        <div class="segmented" role="radiogroup" aria-label="性別">
          <label><input type="radio" name="sex" value="male" checked><span>男性</span></label>
          <label><input type="radio" name="sex" value="female"><span>女性</span></label>
        </div>
        <p class="bmi">BMI <output id="bmi">22.5</output> <span id="bmi-class" class="bmi-class">普通体重</span></p>
      </div>
      <div class="field">
        <div class="field-head">
          <label for="height-num">身長</label>
          <span class="num"><input type="number" id="height-num" inputmode="decimal" min="130" max="200" step="0.1" value="170"> cm</span>
        </div>
        <input type="range" id="height" min="130" max="200" step="1" value="170" aria-label="身長">
      </div>
      <div class="field">
        <div class="field-head">
          <label for="weight-num">体重</label>
          <span class="num"><input type="number" id="weight-num" inputmode="decimal" min="30" max="150" step="0.1" value="65"> kg</span>
        </div>
        <input type="range" id="weight" min="30" max="150" step="1" value="65" aria-label="体重">
      </div>
    </form>
  </main>
  <script type="module" src="app.js"></script>
  <script type="module" src="pwa.js"></script>
</body>
</html>
